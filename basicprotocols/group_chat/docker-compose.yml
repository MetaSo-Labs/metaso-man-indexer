version: '3.8'

services:
  group-chat-service:
    build:
      context: ../..
      dockerfile: basicprotocols/group_chat/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
    volumes:
      - group_chat_data:/app/data
      - blockfile_data:/app/blockfileData
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - group_chat_network

volumes:
  group_chat_data:
    driver: local

networks:
  group_chat_network:
    driver: bridge 