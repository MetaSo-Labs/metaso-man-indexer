version: '3.8'

services:
  group-chat-service:
    build:
      context: ../..
      dockerfile: basicprotocols/group_chat/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
    volumes:
      - group_chat_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - group_chat_network

  # 可选：添加 Redis 用于缓存
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - group_chat_network

volumes:
  group_chat_data:
    driver: local
  redis_data:
    driver: local

networks:
  group_chat_network:
    driver: bridge 