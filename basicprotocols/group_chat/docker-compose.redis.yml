version: '3.8'

services:
  redis:
    image: redis:latest
    container_name: redis-db
    ports:
      - "6379:6379"
    volumes:
      - /mnt/redis/data:/data
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "your_password", "--maxmemory", "2gb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "your_password", "ping"]
      interval: 5s
      timeout: 30s
      retries: 50
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 2G