basePath: /
definitions:
  models.ChatType:
    enum:
    - 0
    - 6
    - 1
    - 2
    - 22
    - 3
    - 4
    - 5
    format: int64
    type: integer
    x-enum-comments:
      ChatTypeEmoji: 群聊 - 表情类型
      ChatTypeFile: 群聊 - 文件类型
      ChatTypeJoin: 群聊 - 加入类型
      ChatTypeLeave: 群聊 - 离开类型
      ChatTypeMsg: 群聊 - 信息类型
      ChatTypeOpenRed: 群聊 - 抢红包类型
      ChatTypeRecycleRed: 群聊 - 回收红包类型
      ChatTypeRed: 群聊 - 红包类型
    x-enum-descriptions:
    - 群聊 - 信息类型
    - 群聊 - 表情类型
    - 群聊 - 红包类型
    - 群聊 - 抢红包类型
    - 群聊 - 回收红包类型
    - 群聊 - 文件类型
    - 群聊 - 加入类型
    - 群聊 - 离开类型
    x-enum-varnames:
    - ChatTypeMsg
    - ChatTypeEmoji
    - ChatTypeRed
    - ChatTypeOpenRed
    - ChatTypeRecycleRed
    - ChatTypeFile
    - ChatTypeJoin
    - ChatTypeLeave
  respond.GroupChatItem:
    properties:
      chatType:
        allOf:
        - $ref: '#/definitions/models.ChatType'
        description: 0-msg, 1-red, 2-img
      content:
        type: string
      contentType:
        type: string
      data: {}
      encryption:
        type: string
      groupId:
        description: 房间ID 唯一
        type: string
      metaId:
        type: string
      metanetId:
        type: string
      nickName:
        description: |-
          UserInfo    *model.UserInfoResp `json:"userInfo"`
          AvatarTxId  string              `json:"avatarTxId"`
          AvatarImage string              `json:"avatarImage"`
          AvatarType  model.AvatarType    `json:"avatarType"`
        type: string
      params:
        description: 通用字段，便于后续新增参数
        type: string
      protocol:
        type: string
      redMetaId:
        type: string
      replyInfo:
        $ref: '#/definitions/respond.ReplyInfo'
      replyTx:
        type: string
      timestamp:
        description: 聊天记录时间戳
        type: integer
      txId:
        type: string
    type: object
  respond.GroupChatResponse:
    properties:
      list:
        items:
          $ref: '#/definitions/respond.GroupChatItem'
        type: array
      nextTimestamp:
        type: integer
      total:
        type: integer
    type: object
  respond.GroupItem:
    properties:
      chatSettingType:
        description: 用于设置发言限制， 0-所有人，1-管理员
        type: integer
      communityId:
        description: 社区Id 唯一
        type: string
      createUserMetaId:
        description: 创建人的metaId
        type: string
      deleteStatus:
        description: 删除状态，0-正常，1-删除
        type: integer
      groupId:
        description: 房间ID 唯一
        type: string
      roomAvatarUrl:
        description: 房间头像url
        type: string
      roomCodeHash:
        description: roomJoinType为2时有值，codeHash
        type: string
      roomGenesis:
        description: roomJoinType为2时有值，genesis
        type: string
      roomGenesisSeriesName:
        type: string
      roomJoinType:
        description: 加入方式，1为密码，2为nft
        type: string
      roomLimitAmount:
        description: roomJoinType为2时有值，token的限制
        type: integer
      roomName:
        description: 创建房间的名称
        type: string
      roomNewestContent:
        description: 房间最新聊天内容
        type: string
      roomNewestMetaId:
        description: 房间最新聊天内容的MetaId
        type: string
      roomNewestProtocol:
        description: 房间最新聊天内容的协议类型
        type: string
      roomNewestTimestamp:
        description: 房间最新聊天的时间戳
        type: integer
      roomNewestTxId:
        description: 房间最新聊天内容的txId
        type: string
      roomNewestUserName:
        description: 房间最新聊天内容的MetaId
        type: string
      roomNinePersonHash:
        description: 房间前9位人员的metaId总hash值
        type: string
      roomNote:
        description: 创建房间的公告
        type: string
      roomStatus:
        description: '"1" 未加密时为“1” 加密时为加密后的信息, 保留字段'
        type: string
      roomType:
        description: 创建房间的类型 ”1“不加密 “2”加密 加密采用AES加密算法
        type: string
      timestamp:
        description: 创建你房间的时间戳
        type: integer
      txId:
        description: 房间的TxId
        type: string
      userCount:
        description: 房间人数
        type: integer
    type: object
  respond.GroupMemberItem:
    properties:
      address:
        type: string
      metaId:
        type: string
      name:
        type: string
      timeStr:
        type: string
      timestamp:
        type: integer
    type: object
  respond.GroupMemberResponse:
    properties:
      list:
        items:
          $ref: '#/definitions/respond.GroupMemberItem'
        type: array
      total:
        type: integer
    type: object
  respond.GroupResponse:
    properties:
      list:
        items:
          $ref: '#/definitions/respond.GroupItem'
        type: array
      total:
        type: integer
    type: object
  respond.Message:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
      processingTime:
        type: integer
      processingTimeInMid:
        type: integer
    type: object
  respond.ReplyInfo:
    properties:
      chatType:
        allOf:
        - $ref: '#/definitions/models.ChatType'
        description: 0-msg, 1-red, 2-img
      content:
        type: string
      contentType:
        type: string
      encryption:
        type: string
      metaId:
        type: string
      nickName:
        description: UserInfo    *models.UserInfoResp `json:"userInfo"`
        type: string
      protocol:
        type: string
      timestamp:
        description: 聊天记录时间戳
        type: integer
      txId:
        type: string
    type: object
