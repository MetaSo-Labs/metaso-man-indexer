        "400":
          description: Parameter error
          schema:
            type: object
      summary: Get latest chat group list
      tags:
      - Group Management
  /group-chat/group-info:
    get:
      description: Get detailed information of specified group
      parameters:
      - description: Group ID
        in: query
        name: groupId
        required: true
        type: string
      produces:
