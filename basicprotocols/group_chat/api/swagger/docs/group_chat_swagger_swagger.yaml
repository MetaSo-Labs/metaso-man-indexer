  /api/db/collections:
    get:
      description: 获取所有可用的数据库集合名称
      produces:
      - application/json
      responses:
        "200":
          description: 集合列表
          schema:
            type: object
      summary: 获取所有可用的数据库集合
      tags:
      - 数据库查询
  /api/db/group/version/all:
    get:
      description: 获取TalkGroupVersionInfoCollection的所有数据，支持分页
      parameters:
      - default: 1
        description: 页码，从1开始
        in: query
        name: page
        required: false
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: size
        required: false
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询结果
          schema:
            type: object
        "400":
          description: 参数错误
          schema:
            type: object
        "500":
          description: 服务器错误
          schema:
            type: object
      summary: 获取所有群组版本信息列表（分页）
      tags:
