        "500":
          description: 服务器错误
          schema:
            type: object
      summary: 根据groupId获取群组信息
      tags:
      - 数据库查询
  /api/db/group/version:
    get:
      description: 根据groupId或pinId查询TalkGroupVersionInfoCollection数据
      parameters:
      - description: 群组ID
        in: query
        name: groupId
        required: false
        type: string
      - description: PinID
