  /group-chat/group-chat-list:
    get:
      description: Get group chat records with timestamp pagination support
      parameters:
      - description: Group ID
        in: query
        name: groupId
        required: true
        type: string
      - description: User MetaId
        in: query
        name: metaId
        required: false
        type: string
      - description: Cursor, default is 0
        in: query
        name: cursor
        required: false
        type: integer
      - description: Page size, default is 20
        in: query
        name: size
        required: false
        type: integer
              - description: Timestamp for pagination
        in: query
        name: timestamp
        required: false
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully return group chat records
