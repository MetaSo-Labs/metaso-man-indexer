  /api/db/chat/queue:
    get:
      description: 根据timestamp查询TalkGroupChatQueueCollection数据，或不传timestamp获取所有数据
      parameters:
      - description: 时间戳
        in: query
        name: timestamp
        required: false
        type: string
      - default: 10
