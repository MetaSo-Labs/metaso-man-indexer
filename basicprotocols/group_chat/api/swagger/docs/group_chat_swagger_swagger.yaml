  /api/db/chat/pin:
    get:
      description: 根据pinId查询TalkGroupChatPinCollection数据
      parameters:
      - description: PinID
        in: query
        name: pinId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 查询结果
          schema:
