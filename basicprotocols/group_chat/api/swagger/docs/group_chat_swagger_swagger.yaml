          schema:
            type: object
        "500":
          description: 服务器错误
          schema:
            type: object
      summary: 根据communityId获取社区信息
      tags:
      - 数据库查询
  /api/db/community/join:
    get:
      description: 根据communityId或pinId查询TalkCommunityJoinCollection数据
      parameters:
      - description: 社区ID
        in: query
        name: communityId
        required: false
        type: string
      - description: PinID
        in: query
        name: pinId
        required: false
        type: string
      - default: 10
        description: 限制数量
        in: query
        name: limit
        required: false
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询结果
          schema:
            type: object
        "400":
          description: 参数错误
          schema:
            type: object
        "500":
          description: 服务器错误
          schema:
            type: object
      summary: 根据communityId或pinId获取社区加入记录
      tags:
      - 数据库查询
  /api/db/community/person:
    get:
      description: 根据communityId或metaId查询TalkCommunityPersonCollection数据
      parameters:
      - description: 社区ID
        in: query
        name: communityId
        required: false
        type: string
      - description: MetaID
        in: query
