    get:
      description: Get group list with pagination support
      parameters:
      - description: User MetaId
        in: query
        name: metaId
        required: false
        type: string
      - description: Cursor, default is 1
        in: query
        name: cursor
        required: false
        type: integer
      - description: Page size, default is 20
        in: query
        name: size
        required: false
        type: integer
      - description: Timestamp
        in: query
        name: timestamp
        required: false
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully return group list
          schema:
            type: object
      summary: Get group list
      tags:
      - Group Management
  /group-chat/user/latest-group-list:
    get:
      description: Get user's latest chat group list, sorted by latest chat time
      parameters:
      - description: User MetaId
        in: query
        name: metaId
        required: true
        type: string
      - description: Cursor, default is 1
        in: query
        name: cursor
        required: false
