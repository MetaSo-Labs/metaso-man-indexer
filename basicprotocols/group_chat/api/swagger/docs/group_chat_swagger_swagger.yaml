swagger: "2.0"
tags:
- description: 数据库查询相关API，用于查看Pebble数据库中的数据
  name: 数据库查询
- description: 群组管理相关API，包括群组信息、成员管理等
  name: 群组管理
- description: 社区管理相关API，包括社区信息、成员管理等
  name: 社区管理
- description: 聊天功能相关API，包括消息、队列等
  name: 聊天功能
- description: 用户管理相关API，包括用户信息、群列表等
  name: 用户管理
