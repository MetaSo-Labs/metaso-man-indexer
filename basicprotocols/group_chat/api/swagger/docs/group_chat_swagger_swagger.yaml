      responses:
        "200":
          description: 查询结果
          schema:
            type: object
        "400":
          description: 参数错误
          schema:
            type: object
        "500":
          description: 服务器错误
          schema:
            type: object
      summary: 根据communityId或metaId获取社区成员列表
      tags:
      - 数据库查询
  /api/db/group/info:
    get:
      description: 根据groupId查询TalkGroupInfoCollection数据
      parameters:
      - description: 群组ID
        in: query
        name: groupId
        required: true
