basePath: /
host: 0.0.0.0:7568
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: 群聊服务 API 文档，包含数据库查询、群组管理、社区管理等功能
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Group Chat API
  version: "1.0"
paths:
  /group-chat/group-list:
    get:
      description: 获取群组列表，支持分页
      parameters:
      - description: 用户MetaId
        in: query
        name: metaId
        required: false
        type: string
      - description: 游标，默认为1
        in: query
        name: cursor
        required: false
        type: integer
      - description: 每页大小，默认为20
        in: query
        name: size
        required: false
        type: integer
      - description: 时间戳
        in: query
        name: timestamp
        required: false
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功返回群组列表
          schema:
            type: object
      summary: 获取群组列表
      tags:
      - 群组管理
  /group-chat/user/latest-group-list:
    get:
      description: 获取用户的最新聊天群组列表，基于最新聊天时间排序
      parameters:
      - description: 用户MetaId
        in: query
        name: metaId
        required: true
        type: string
      - description: 游标，默认为1
        in: query
        name: cursor
        required: false
        type: integer
      - description: 每页大小，默认为20
        in: query
        name: size
        required: false
        type: integer
      - description: 时间戳
        in: query
        name: timestamp
        required: false
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功返回最新聊天群组列表
          schema:
            type: object
        "400":
          description: 参数错误
          schema:
            type: object
      summary: 获取最新聊天群组列表
      tags:
      - 群组管理
  /group-chat/group-info:
    get:
      description: 获取指定群组的详细信息
      parameters:
      - description: 群组ID
        in: query
        name: groupId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功返回群组信息
          schema:
            type: object
        "400":
          description: 参数错误
          schema:
            type: object
        "404":
          description: 群组不存在
          schema:
            type: object
      summary: 获取群组信息
      tags:
      - 群组管理
  /group-chat/group-chat-list:
    get:
      description: 获取群组的聊天记录，支持时间戳分页
      parameters:
      - description: 群组ID
        in: query
        name: groupId
        required: true
        type: string
      - description: 用户MetaId
        in: query
        name: metaId
        required: false
        type: string
      - description: 游标，默认为0
        in: query
        name: cursor
        required: false
        type: integer
      - description: 每页大小，默认为20
        in: query
        name: size
        required: false
        type: integer
      - description: 时间戳，用于分页
        in: query
        name: timestamp
        required: false
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功返回群组聊天记录
          schema:
            type: object
        "400":
          description: 参数错误
          schema:
            type: object
      summary: 获取群组聊天记录
      tags:
      - 群组管理
  /group-chat/group-member-list:
    get:
      description: 获取群组的成员列表，支持分页
      parameters:
      - description: 群组ID
        in: query
        name: groupId
        required: true
        type: string
      - description: 游标，默认为1
        in: query
        name: cursor
        required: false
        type: integer
      - description: 每页大小，默认为20
        in: query
        name: size
        required: false
        type: integer
      - description: 时间戳
        in: query
        name: timestamp
        required: false
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功返回群组成员列表
          schema:
            type: object
        "400":
          description: 参数错误
          schema:
            type: object
      summary: 获取群组成员列表
      tags:
      - 群组管理
  /group-chat/group-person:
    get:
      description: 根据metaId和groupId获取TalkGroupPersonCollection信息，判断用户是否在指定群组中
      parameters:
      - description: 用户MetaId
        in: query
        name: metaId
        required: true
        type: string
      - description: 群组ID
        in: query
        name: groupId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功返回群组成员信息
          schema:
            type: object
        "400":
          description: 参数错误
          schema:
            type: object
        "500":
          description: 服务器错误
          schema:
            type: object
      summary: 获取群组成员信息
      tags:
      - 群组管理
  /api/db/community/version:
    get:
      description: 根据communityId或pinId查询TalkCommunityVersionInfoCollection数据
      parameters:
      - description: 社区ID
        in: query
        name: communityId
        required: false
        type: string
      - description: PinID
        in: query
        name: pinId
        required: false
        type: string
      - default: 10
        description: 限制数量
        in: query
        name: limit
        required: false
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询结果
          schema:
            type: object
        "400":
          description: 参数错误
          schema:
            type: object
        "500":
          description: 服务器错误
          schema:
            type: object
      summary: 根据communityId或pinId获取社区版本信息
      tags:
      - 数据库查询
  /api/db/community/info:
    get:
      description: 根据communityId查询TalkCommunityInfoCollection数据
      parameters:
      - description: 社区ID
        in: query
        name: communityId
        required: true
        type: string
      produces:
