version: '3.8'

services:
  manindexer-testnet:
    build:
      context: .
      dockerfile: Dockerfile.testnet
    container_name: manindexer-testnet
    ports:
      - "7777:7777"  # Web API 端口
      - "7568:7568"  # Group Chat 端口
    volumes:
      # 数据持久化
      - manindexer_testnet_data:/man/pebble_data
      # 配置文件挂载（可选）
      - ./config_testnet.toml:/man/config_testnet.toml:ro
    environment:
      - CONFIG_FILE=/man/config_testnet.toml
      - NETWORK=testnet
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7777/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  manindexer_testnet_data:
    driver: local 