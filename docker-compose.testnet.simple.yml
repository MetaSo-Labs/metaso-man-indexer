version: '3.8'

services:
  manindexer-testnet:
    build:
      context: .
      dockerfile: Dockerfile.testnet
    container_name: manindexer-testnet
    ports:
      - "7777:7777"  # Web API port
      - "7568:7568"  # Group Chat port
      - "7555:7555"  # Socket port
    volumes:
      # Data persistence - map to external host directory
      - ../data/pebble_data:/man/pebble_data
      # Logs persistence - map to external host directory
      - ../data/log_chat:/man/log_chat
      # Configuration file mount (optional)
      - ./config_testnet.toml:/man/config_testnet.toml:ro
      # Blockfile data persistence - map to external host directory
      - ../data/blockfile_data:/man/blockfile_data
    environment:
      - CONFIG_FILE=/man/config_testnet.toml
      - NETWORK=testnet
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7568/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
